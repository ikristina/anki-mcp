[project]
name = "anki-mcp"
version = "0.1.0"
description = "MCP server that lets agents search, analyze, and add Anki notes via AnkiConnect"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp>=2.2,<3", "gtts>=2.5"]

[project.scripts]
anki-mcp = "anki_mcp.server:main"

[project.optional-dependencies]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-sdk>=1.28",
]

[dependency-groups]
dev = [
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-sdk>=1.28",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
