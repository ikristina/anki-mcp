[project]
name = "anki-mcp"
version = "0.1.0"
description = "MCP server that lets agents search, analyze, and add Anki notes via AnkiConnect"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3", "gtts>=2.5"]

[project.scripts]
anki-mcp = "anki_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
